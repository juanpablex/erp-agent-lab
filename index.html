<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>ERP Agent Lab</title>
    <meta name="description" content="An agent that operates a fictional ERP through an MCP server, with human approval for every write action." />
    <script>
    // Apply the saved theme (or the system one) before the first paint to avoid a flash.
    try {
      var t = localStorage.getItem("theme");
      if (t !== "light" && t !== "dark") t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) { document.documentElement.setAttribute("data-theme", "dark"); }
  </script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
